<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Pracownia 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: warsztat — wąska szyna kształtów | widok 3D nad stołem drukarki | kolumna właściwości */
:root {
  --bg: #e6e9ec;
  --surface: #f6f7f8;
  --surface-2: #dde2e7;
  --ink: #18202a;
  --ink-2: #55606d;
  --line: #c6cdd5;
  --accent: #d4831a;
  --accent-ink: #1c1204;
  --accent-soft: #f3dfc1;
  --ok: #24804f;
  --warn: #9a6200;
  --bad: #b8352a;
  --ax-x: #c4443a;
  --ax-y: #3a8f4c;
  --ax-z: #3570c4;
  --viewport: #d2d8de;
  --bed: #c9a86b;
  --bed-line: #b08e52;
  --bed-line-major: #8a6a32;
  --hole: #7c8794;
  --hole-line: #4d5763;
  --volume-line: #8d98a4;
  --f-display: "Chakra Petch", "Bahnschrift", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101419; --surface: #171c22; --surface-2: #222930; --ink: #e4e8ec; --ink-2: #97a1ad; --line: #2d353f;
    --accent: #f0a03a; --accent-ink: #1c1204; --accent-soft: #3b2a12;
    --ok: #5cc28a; --warn: #e7b04a; --bad: #ff7a6b;
    --ax-x: #ff7b70; --ax-y: #6fd283; --ax-z: #79a8ff;
    --viewport: #0c1014; --bed: #3a3124; --bed-line: #554631; --bed-line-major: #7a6440;
    --hole: #93a0ad; --hole-line: #c3ccd5; --volume-line: #3e4954;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101419; --surface: #171c22; --surface-2: #222930; --ink: #e4e8ec; --ink-2: #97a1ad; --line: #2d353f;
  --accent: #f0a03a; --accent-ink: #1c1204; --accent-soft: #3b2a12;
  --ok: #5cc28a; --warn: #e7b04a; --bad: #ff7a6b;
  --ax-x: #ff7b70; --ax-y: #6fd283; --ax-z: #79a8ff;
  --viewport: #0c1014; --bed: #3a3124; --bed-line: #554631; --bed-line-major: #7a6440;
  --hole: #93a0ad; --hole-line: #c3ccd5; --volume-line: #3e4954;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--f-body);
  padding-inline: 16px;
  padding-block: 12px;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr) 320px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "rail stage panel";
  gap: 12px;
}

/* ---------- górny pasek ---------- */
.topbar { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 19px/1 var(--f-display); letter-spacing: .02em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
.proj { flex: 1 1 180px; min-width: 0; max-width: 340px; }
.proj input {
  width: 100%; border: 1px solid transparent; background: transparent; border-radius: 6px;
  padding: 6px 8px; font-weight: 500; color: var(--ink-2);
}
.proj input:hover, .proj input:focus { border-color: var(--line); background: var(--surface); color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
.sep { width: 1px; height: 22px; background: var(--line); margin-inline: 4px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500;
  cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.icon { padding: 6px 8px; }
.btn.icon svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 85%, var(--ink)); }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); }

/* ---------- szyna kształtów ---------- */
.rail {
  grid-area: rail; display: flex; flex-direction: column; gap: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 6px; overflow-y: auto;
}
.rail h2 { font: 600 10px/1 var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); text-align: center; padding: 6px 0 4px; margin: 0; }
.shape {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 2px 6px; border: 1px solid transparent; border-radius: 6px;
  background: transparent; cursor: pointer; font-size: 10.5px; line-height: 1.15; color: var(--ink-2);
}
.shape svg { width: 30px; height: 30px; color: var(--ink); }
.shape:hover { background: var(--surface-2); color: var(--ink); }
.shape.holeish svg { color: var(--hole); }

/* ---------- widok 3D ---------- */
.stage { grid-area: stage; min-width: 0; min-height: 0; }
.viewport {
  position: relative; width: 100%; height: 100%; min-height: 320px;
  border-radius: var(--r); overflow: hidden; background: var(--viewport);
  border: 1px solid var(--line);
}
.viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud {
  position: absolute; top: 10px; left: 10px; max-width: calc(100% - 20px);
  display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline;
  padding: 6px 10px; border-radius: 6px; pointer-events: none;
  background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line);
  font-size: 12px;
}
.hud b { font-weight: 600; }
.hud .m { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.vp-bar {
  position: absolute; left: 8px; right: 8px; bottom: 8px;
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 6px;
  pointer-events: none;
}
.vp-bar > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: auto; }
.seg {
  display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
}
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover:not(:disabled) { color: var(--ink); background: var(--surface-2); }
.seg button.on { background: var(--ink); color: var(--surface); }
.seg button:disabled { opacity: .4; cursor: default; }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; }
.snap {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; font-size: 12.5px; color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 6px; background: color-mix(in srgb, var(--surface) 92%, transparent);
}
.snap select { border: 0; background: transparent; padding: 3px; font-family: var(--f-mono); font-size: 12px; }
#btn-preview[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------- panel ---------- */
.panel { grid-area: panel; min-width: 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card h2 {
  margin: 0; display: flex; justify-content: space-between; align-items: baseline;
  font: 600 12px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2);
}
.card h2 small { font: 400 12px var(--f-mono); letter-spacing: 0; text-transform: none; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
legend { padding: 0; margin-bottom: 6px; font-size: 12px; font-weight: 600; }
legend small { font-weight: 400; color: var(--ink-2); margin-left: 4px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 600; }
.field input, .field select {
  width: 100%; min-width: 0; padding: 6px 7px; border: 1px solid var(--line); border-radius: 5px;
  background: var(--bg); font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums;
}
.field select { font-family: var(--f-body); }
.ax-x { color: var(--ax-x) !important; }
.ax-y { color: var(--ax-y) !important; }
.ax-z { color: var(--ax-z) !important; }
.sel-head { display: flex; gap: 8px; align-items: center; }
.name-in { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); font-weight: 600; }
.type-tag { font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.check { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw {
  width: 24px; height: 24px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent);
  cursor: pointer; padding: 0;
}
.sw.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.sw-custom { position: relative; width: 24px; height: 24px; border-radius: 50%; overflow: hidden; border: 1px dashed var(--ink-2); cursor: pointer; }
.sw-custom input { position: absolute; inset: -6px; width: 40px; height: 40px; border: 0; padding: 0; cursor: pointer; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
.btn-row .btn { flex: 1 1 auto; }
.align { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; font-size: 12px; }
.align .seg button { padding: 5px 8px; font-size: 12px; }
.hint, .note { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.note { font-size: 11.5px; }
.tips { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 12.5px; color: var(--ink-2); }
kbd {
  font: 500 11px var(--f-mono); padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; background: var(--bg); color: var(--ink); white-space: nowrap;
}
.stats { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.stats div { min-width: 0; }
.stats dt { font-size: 11px; color: var(--ink-2); }
.stats dd { margin: 2px 0 0; font: 500 15px/1.25 var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.chip.busy { color: var(--ink-2); border-color: var(--line); }
.outliner { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
.ol {
  width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 0; border-radius: 5px;
  background: transparent; cursor: pointer; text-align: left;
}
.ol:hover { background: var(--surface-2); }
.ol.on { background: var(--accent-soft); }
.ol .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol .tp { font-size: 11px; color: var(--ink-2); }
.dot { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); }
.dot.hole { background: repeating-linear-gradient(135deg, var(--hole) 0 2px, transparent 2px 4px); }
.empty { font-size: 12.5px; color: var(--ink-2); padding: 4px 2px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: min(520px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 8px;
  background: var(--ink); color: var(--surface); font-size: 13px; box-shadow: 0 6px 24px rgb(0 0 0 / .25);
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
}
.toast.show { opacity: 1; }
.boot { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); font-size: 13px; text-align: center; padding: 16px; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app {
    height: auto;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto auto;
    grid-template-areas: "top" "rail" "stage" "panel";
  }
  .rail { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
  .rail h2 { display: none; }
  .shape { flex: 0 0 64px; }
  .stage { height: 62svh; min-height: 340px; }
  .panel { overflow: visible; }
  .actions { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 3h14v8l-4 5h-6l-4-5z"/><path d="M13 16l3 5 3-5"/><path d="M5 28h22M8 24.5h16" stroke-linecap="round"/>
      </svg>
      <span>Pracownia 3D</span>
    </div>
    <div class="proj"><input id="proj-name" aria-label="Nazwa projektu" value="Kubek na długopisy" spellcheck="false"></div>
    <div class="actions">
      <button class="btn icon" id="btn-undo" title="Cofnij (Ctrl+Z)" aria-label="Cofnij" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>
      </button>
      <button class="btn icon" id="btn-redo" title="Ponów (Ctrl+Shift+Z)" aria-label="Ponów" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg>
      </button>
      <span class="sep"></span>
      <button class="btn" id="btn-new">Nowy</button>
      <button class="btn" id="btn-open">Otwórz…</button>
      <input type="file" id="file-in" accept=".json,.stl,application/json" hidden>
      <button class="btn" id="btn-save">Zapisz projekt</button>
      <button class="btn primary" id="btn-export">Eksport STL</button>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Dodaj kształt"><h2>Dodaj</h2></nav>

  <main class="stage">
    <div class="viewport" id="viewport">
      <div class="boot" id="boot">Ładuję silnik 3D…</div>
      <div class="hud" id="hud" hidden></div>
      <div class="vp-bar">
        <div>
          <div class="seg" id="modes" role="group" aria-label="Narzędzie">
            <button data-mode="translate" class="on" title="Przesuń (W)">Przesuń</button>
            <button data-mode="rotate" title="Obróć (E)">Obróć</button>
            <button data-mode="scale" title="Skaluj (R)">Skaluj</button>
          </div>
          <label class="snap">Skok
            <select id="snap-sel">
              <option value="0">wył.</option>
              <option value="0.1">0,1 mm</option>
              <option value="0.5">0,5 mm</option>
              <option value="1" selected>1 mm</option>
              <option value="5">5 mm</option>
              <option value="10">10 mm</option>
            </select>
          </label>
        </div>
        <div>
          <div class="seg" id="views" role="group" aria-label="Widok">
            <button data-view="iso" title="Widok 3D">3D</button>
            <button data-view="top" title="Widok z góry">Góra</button>
            <button data-view="front" title="Widok z przodu">Przód</button>
            <button data-view="fit" title="Dopasuj widok (F)">Dopasuj</button>
          </div>
          <button class="btn" id="btn-preview" aria-pressed="false" title="Pokaż model po połączeniu brył i wycięciu otworów (P)">Podgląd wydruku</button>
        </div>
      </div>
    </div>
  </main>

  <aside class="panel" id="panel">
    <section class="card" id="sec-sel" aria-live="polite"></section>
    <section class="card">
      <h2>Model do druku <small id="st-busy"></small></h2>
      <dl class="stats">
        <div><dt>Wymiary X × Y × Z</dt><dd id="st-size">—</dd></div>
        <div><dt>Objętość</dt><dd id="st-vol">—</dd></div>
        <div><dt>Masa PLA*</dt><dd id="st-mass">—</dd></div>
        <div><dt>Filament Ø1,75*</dt><dd id="st-len">—</dd></div>
      </dl>
      <div class="chips" id="st-chips"></div>
      <label class="field"><span>Drukarka (rozmiar stołu)</span><select id="bed-sel"></select></label>
      <p class="note">* Przy 100% wypełnienia, gęstość PLA 1,24 g/cm³. Rzeczywiste zużycie zależy od wypełnienia i liczby ścianek ustawionych w slicerze.</p>
    </section>
    <section class="card">
      <h2>Obiekty <small id="ol-count"></small></h2>
      <ul class="outliner" id="outliner"></ul>
    </section>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js",

  }
}

<script>
  // Komunikat, gdy biblioteki 3D się nie wczytają (np. brak internetu).
  setTimeout(() => {
    const b = document.getElementById('boot');
    if (b && !b.hidden) b.textContent = 'Nie udało się wczytać silnika 3D. Sprawdź połączenie z internetem i odśwież stronę.';
  }, 15000);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { Brush, Evaluator, ADDITION, SUBTRACTION } from 'three-bvh-csg';

const $ = s => document.querySelector(s);
const deg = THREE.MathUtils.degToRad;
const toDeg = THREE.MathUtils.radToDeg;
const r2 = v => Math.round(v * 100) / 100;
const fmt = (v, d = 1) => Number(v).toLocaleString('pl-PL', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888888';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ======================= Dane: drukarki, kolory, kształty ======================= */
const BEDS = {
  ender3:   { label: 'Creality Ender 3 · 220×220×250', size: [220, 220, 250] },
  mk4:      { label: 'Prusa MK4 · 250×210×220', size: [250, 210, 220] },
  mini:     { label: 'Prusa MINI · 180×180×180', size: [180, 180, 180] },
  a1:       { label: 'Bambu Lab A1 / P1S / X1C · 256×256×256', size: [256, 256, 256] },
  a1mini:   { label: 'Bambu Lab A1 mini · 180×180×180', size: [180, 180, 180] },
  neptune4: { label: 'Elegoo Neptune 4 · 225×225×265', size: [225, 225, 265] },
  kobra2:   { label: 'Anycubic Kobra 2 · 220×220×250', size: [220, 220, 250] },
  big:      { label: 'Duża drukarka · 300×300×300', size: [300, 300, 300] },

function updateStats() {

    chips.push(['busy', objects.length ? 'Same otwory, brak brył do druku' : 'Stół jest pusty']);
  } else {
    const b = g.boundingBox, s = new THREE.Vector3(); b.getSize(s);

    $('#st-size').textContent = `${fmt(s.x)} × ${fmt(s.y)} × ${fmt(s.z)} mm`;
    $('#st-vol').textContent = `${fmt(vol / 1000, 2)} cm³`;

function meshFromWorld(pos, name, color) {

}

function toSTL(pos) {

}

}

      exitPreview(); snapshot();
      const o = meshFromWorld(pos, f.name.replace(/\.stl$/i, ''), SWATCHES[2][0]);
      o.x = 0; o.y = 0; o.z = 0;
      objects.push(o); selected = [o.id];
      syncAll(); fitView();
      toast(pos.length / 9 > 250000 ? `Wczytano ${f.name}. Duży model – łączenie brył może chwilę trwać.` : `Wczytano ${f.name}`);
    } else {
      const data = JSON.parse(await f.text());
      exitPreview(); snapshot(); loadProject(data); syncAll(); fitView();
      toast(`Otwarto projekt: ${f.name}`);
    }
  } catch (err) { console.error(err); toast(err.message || 'Nie udało się otworzyć pliku.'); }
});

/* ======================= Pamięć przeglądarki ======================= */
const LS_KEY = 'pracownia3d.v1';
let saveTimer = 0;
function saveLocalSoon() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify({ ...serialize(), snap })); } catch { /* brak miejsca lub zablokowana pamięć */ } }, 600);
}
function restoreLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY); if (!raw) return false;
    const data = JSON.parse(raw); loadProject(data);
    if (data.snap != null) { snap = data.snap; $('#snap-sel').value = String(snap); applySnap(); }
    return true;
  } catch { return false; }
}
function loadSample() {
  objects = []; nextId = 1; selected = [];
  objects.push(makeObj('cylinder', { name: 'Kubek – korpus', w: 72, d: 72, h: 95, x: -30, color: '#d9822b' }));
  objects.push(makeObj('cylinder', { name: 'Kubek – wnętrze', hole: true, w: 66, d: 66, h: 95, x: -30, z: 3 }));
  objects.push(makeObj('hex', { name: 'Podkładka', w: 40, d: 34.64, h: 6, x: 50, color: '#3a7bd5' }));
  objects.push(makeObj('cylinder', { name: 'Otwór Ø12', hole: true, w: 12, d: 12, h: 10, x: 50, z: -2 }));
  $('#proj-name').value = 'Kubek na długopisy';
}

/* ======================= Widok ======================= */
function fitView(dir) {
  const box = new THREE.Box3();
  meshes.forEach(m => { if (!objects.find(o => o.id === m.userData.id)?.hole) box.expandByObject(m); });
  if (box.isEmpty()) { const [bx, by] = BEDS[bedKey].size; box.set(new THREE.Vector3(-bx / 2, -by / 2, 0), new THREE.Vector3(bx / 2, by / 2, 30)); }
  const c = new THREE.Vector3(), s = new THREE.Vector3(); box.getCenter(c); box.getSize(s);
  const r = Math.max(s.length() / 2, 25);
  const dist = r / Math.sin(deg(camera.fov) / 2) * 1.05;
  const d = (dir || camera.position.clone().sub(orbit.target)).clone().normalize();
  orbit.target.copy(c);
  camera.position.copy(c).addScaledVector(d, dist);
  orbit.update();
}
const VIEWS = { iso: new THREE.Vector3(0.55, -0.85, 0.65), top: new THREE.Vector3(0, -0.0001, 1), front: new THREE.Vector3(0, -1, 0.08) };
$('#views').addEventListener('click', e => {
  const v = e.target.closest('button')?.dataset.view; if (!v) return;
  fitView(v === 'fit' ? null : VIEWS[v]);
});
$('#modes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  setMode(b.dataset.mode);
});
function setMode(m) { mode = m; if (selected.length === 1) tc.setMode(m); refreshSelection(); }
$('#snap-sel').addEventListener('change', e => { snap = parseFloat(e.target.value); applySnap(); saveLocalSoon(); });
$('#btn-preview').addEventListener('click', () => setPreview(!previewMode));

/* ======================= Pasek górny ======================= */
$('#btn-undo').addEventListener('click', undo);
$('#btn-redo').addEventListener('click', redo);
$('#btn-open').addEventListener('click', () => $('#file-in').click());
$('#btn-save').addEventListener('click', saveProject);
$('#btn-export').addEventListener('click', exportSTL);
$('#proj-name').addEventListener('change', saveLocalSoon);
let newArmed = 0;
$('#btn-new').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!newArmed) {
    b.classList.add('armed'); b.textContent = 'Wyczyścić stół?';
    newArmed = setTimeout(() => { newArmed = 0; b.classList.remove('armed'); b.textContent = 'Nowy'; }, 3000);
    return;
  }
  clearTimeout(newArmed); newArmed = 0; b.classList.remove('armed'); b.textContent = 'Nowy';
  exitPreview(); snapshot();
  objects = []; selected = []; $('#proj-name').value = 'Nowy projekt';
  syncAll(); toast('Nowy projekt. Ctrl+Z przywraca poprzedni.');
});

/* ======================= Szyna kształtów ======================= */
const rail = $('#rail');
for (const t of ['box', 'cylinder', 'sphere', 'halfsphere', 'cone', 'pyramid', 'hex', 'wedge', 'tube', 'torus']) {
  const b = document.createElement('button');
  b.className = 'shape'; b.title = 'Dodaj: ' + TYPES[t].label;
  b.innerHTML = `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${ICON[t]}</svg>${TYPES[t].short}`;
  b.addEventListener('click', () => addShape(t));
  rail.append(b);
}
{
  const b = document.createElement('button');
  b.className = 'shape holeish'; b.title = 'Dodaj otwór w kształcie walca';
  b.innerHTML = `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 2.5" aria-hidden="true">${ICON.cylinder}</svg>Otwór`;
  b.addEventListener('click', () => { addShape('cylinder'); const o = sel1(); o.hole = true; o.name = 'Otwór ' + o.id; o.h = 30; o.w = o.d = 8; syncAll(); });
  rail.append(b);
}

/* ======================= Klawiatura ======================= */
addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches?.('input, select, textarea')) { if (e.key === 'Enter') t.blur(); return; }
  const ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (ctrl && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (ctrl && k === 'y') { e.preventDefault(); redo(); return; }
  if (ctrl && k === 'd') { e.preventDefault(); act('dup'); return; }
  if (ctrl && k === 'g') { e.preventDefault(); groupSelected(); return; }
  if (ctrl && k === 'a') { e.preventDefault(); exitPreview(); selected = objects.map(o => o.id); selectionChanged(); return; }
  if (ctrl && k === 's') { e.preventDefault(); saveProject(); return; }
  if (ctrl) return;
  if (k === 'delete' || k === 'backspace') { e.preventDefault(); act('del'); }
  else if (k === 'w') setMode('translate');
  else if (k === 'e') setMode('rotate');
  else if (k === 'r') setMode('scale');
  else if (k === 'h') { const l = selObjs(); if (l.length) act(l.every(o => o.hole) ? 'solid' : 'hole'); }
  else if (k === 'd') act('drop');
  else if (k === 'f') fitView();
  else if (k === 'p') setPreview(!previewMode);
  else if (k === 'escape') { selected = []; selectionChanged(); }
  else if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'pageup', 'pagedown'].includes(k) && selected.length) {
    e.preventDefault();
    const st = (snap || 1) * (e.shiftKey ? 10 : 1);
    const [ax, sg] = { arrowleft: ['x', -1], arrowright: ['x', 1], arrowup: ['y', 1], arrowdown: ['y', -1], pageup: ['z', 1], pagedown: ['z', -1] }[k];
    if (!e.repeat) snapshot();
    selObjs().forEach(o => { o[ax] = r2(o[ax] + sg * st); });
    syncAll();
  }
});

/* ======================= Motyw, rozmiar, pętla ======================= */
function applyTheme() {
  scene.background = new THREE.Color(tok('--viewport'));
  buildBed();
  meshes.forEach(m => { m.userData.color = null; });
  objects.forEach(ensureMesh);
  refreshSelection();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function resize() {
  const w = vp.clientWidth, h = vp.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(vp);

let toastTimer = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

$('#bed-sel').innerHTML = Object.entries(BEDS).map(([k, b]) => `<option value="${k}">${b.label}</option>`).join('');
const restored = restoreLocal();
if (!restored) loadSample();
$('#bed-sel').value = bedKey;
applyTheme();
resize();
syncAll();
undoStack.length = 0; updateUndoButtons();
fitView(VIEWS.iso);
if (!restored) toast('Przykład: kubek na długopisy i podkładka z otworem. Kliknij „Podgląd wydruku”, by zobaczyć wynik.');

renderer.setAnimationLoop(() => {
  orbit.update();
  selHelpers.forEach(h => h.update());
  renderer.render(scene, camera);
});
</script>
