<title>{{TYTUL}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Sala kinowa na telewizor: jeden ciemny świat (zieleń nocnego ogrodu, mosiądz), duży ekran u góry, rząd plakatów pod nim. */
:root{
  --bg:#0b100e; --panel:#131a17; --line:#24302b; --ink:#eef0ea; --ink-2:#a8b4ad; --ink-3:#6f7d76;
  --brass:#c9a96e; --leaf:#86ad80;
  --f-disp:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font:400 1rem/1.55 var(--f-body);padding-inline:clamp(16px,3vw,48px);padding-block:20px 48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin-inline:auto;display:grid;gap:22px}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 24px}
.brand h1{margin:0;font:700 clamp(1.6rem,3.4vw,2.6rem)/1.05 var(--f-disp);font-stretch:118%;letter-spacing:-.01em;text-wrap:balance}
.brand h1 span{color:var(--brass)}
.brand p{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.tab,.btn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font:500 .95rem/1 var(--f-body)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-main{background:var(--brass);border-color:var(--brass);color:#14100a;font-weight:600}
:is(button,a,.card):focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:22px;align-items:start}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:6px;overflow:hidden}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.screen video.ukryty{visibility:hidden}
.screen .start{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55));border:0;padding:0}
.screen .start img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.screen .start span{position:relative;display:grid;place-items:center;width:clamp(64px,9vw,104px);aspect-ratio:1;border-radius:50%;background:rgba(11,16,14,.72);border:2px solid var(--ink)}
.screen .start span::before{content:"";margin-left:8%;border-style:solid;border-width:16px 0 16px 26px;border-color:transparent transparent transparent var(--ink)}
.bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%;width:0;background:var(--brass)}
.info{display:grid;gap:12px;min-width:0}
.info .num{font:500 .8rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.info h2{margin:0;font:700 clamp(1.5rem,2.6vw,2.2rem)/1.08 var(--f-disp);font-stretch:115%;text-wrap:balance}
.info p{margin:0;color:var(--ink-2)}
.info .czas{font:400 .85rem/1.3 var(--f-mono);color:var(--ink-3)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px}
.help{font:400 .78rem/1.5 var(--f-mono);color:var(--ink-3)}
.help kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{display:grid;gap:8px;background:transparent;border:0;padding:0;text-align:left;min-width:0}
.card .pl{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:5px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.card .pl img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .pl img,.card:focus-visible .pl img{transform:scale(1.03)}
.card .pl b{position:absolute;left:8px;top:8px;font:500 .72rem/1 var(--f-mono);letter-spacing:.1em;background:rgba(11,16,14,.78);padding:5px 7px;border-radius:3px}
.card .pl em{position:absolute;right:8px;bottom:8px;font:400 .72rem/1 var(--f-mono);font-style:normal;background:rgba(11,16,14,.78);padding:4px 6px;border-radius:3px}
.card .nm{font:600 1.02rem/1.25 var(--f-body)}
.card .tg{font-size:.84rem;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card[aria-current="true"] .pl{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.card[aria-current="true"] .nm{color:var(--brass)}
.note{color:var(--ink-3);font-size:.85rem;max-width:80ch}
.note a{color:var(--ink-2)}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.card .pl img{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Ogrody <span>pod szkłem</span> · kino</h1>
      <p>{{OPIS}}</p>
    </div>
    <div class="tabs" role="tablist" aria-label="Wersja kolekcji" id="tabs"></div>
  </header>

  <section class="stage" aria-label="Odtwarzacz">
    <div class="screen" id="screen">
      <video id="vA" playsinline preload="metadata"></video>
      <video id="vB" class="ukryty" playsinline preload="none"></video>
      <button class="start" id="start" type="button" aria-label="Odtwórz film"><img id="poster" alt=""><span></span></button>
      <div class="bar" aria-hidden="true"><i id="prog"></i></div>
    </div>
    <div class="info">
      <div class="num" id="iNum"></div>
      <h2 id="iName"></h2>
      <p id="iTag"></p>
      <div class="czas" id="iCzas"></div>
      <div class="ctrl">
        <button class="btn btn-main" id="bPlay" type="button">Odtwórz</button>
        <button class="btn" id="bAll" type="button" aria-pressed="false">Odtwarzaj wszystkie po kolei</button>
        <button class="btn" id="bPrev" type="button">Poprzedni</button>
        <button class="btn" id="bNext" type="button">Następny</button>
        <button class="btn" id="bFull" type="button">Pełny ekran</button>
      </div>
      <p class="help">Pilot / klawiatura: <kbd>Enter</kbd> odtwórz · <kbd>Spacja</kbd> pauza · <kbd>N</kbd> / <kbd>P</kbd> następny / poprzedni · <kbd>F</kbd> pełny ekran</p>
    </div>
  </section>

  <section aria-label="Filmy"><div class="grid" id="grid"></div></section>
  <p class="note">{{STOPKA}}</p>
</div>

<script>
const FILMY = {{FILMY}};
const WERSJE = {{WERSJE}};
const $ = (id) => document.getElementById(id);
let wersja = WERSJE[0].id, lista = [], cur = 0, part = 0, wszystkie = false;
let vA = $("vA"), vB = $("vB");

function fmt(s){ s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function filmyWersji(w){ return FILMY.filter(f => f.wersja === w); }

function tabs(){
  const t = $("tabs"); t.textContent = "";
  for (const w of WERSJE) {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(w.id === wersja));
    b.textContent = w.nazwa + " · " + filmyWersji(w.id).length + " filmów";
    b.onclick = () => { wersja = w.id; tabs(); siatka(); wybierz(0, false); };
    t.appendChild(b);
  }
}

function siatka(){
  lista = filmyWersji(wersja);
  const g = $("grid"); g.textContent = "";
  lista.forEach((f, i) => {
    const c = document.createElement("button");
    c.className = "card"; c.type = "button";
    c.innerHTML = '<span class="pl"><img loading="lazy" alt=""><b></b><em></em></span><span class="nm"></span><span class="tg"></span>';
    c.querySelector("img").src = f.plakat;
    c.querySelector("b").textContent = f.numer;
    c.querySelector("em").textContent = fmt(f.czas);
    c.querySelector(".nm").textContent = f.nazwa;
    c.querySelector(".tg").textContent = f.opis;
    c.onclick = () => { wybierz(i, true); $("screen").scrollIntoView({block: "nearest", behavior: "smooth"}); };
    g.appendChild(c);
  });
}

function zaznacz(){
  [...$("grid").children].forEach((c, i) => c.setAttribute("aria-current", String(i === cur)));
}

function wybierz(i, graj){
  if (!lista.length) return;
  cur = (i + lista.length) % lista.length; part = 0;
  const f = lista[cur];
  $("iNum").textContent = f.numer + " · wersja " + f.wersja;
  $("iName").textContent = f.nazwa;
  $("iTag").textContent = f.opis;
  $("iCzas").textContent = "czas " + fmt(f.czas);
  $("poster").src = f.plakat;
  [vA, vB].forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); });
  vA.classList.remove("ukryty"); vB.classList.add("ukryty");
  $("prog").style.width = "0";
  zaznacz();
  if (graj) start(); else $("start").hidden = false;
}

function start(){
  const f = lista[cur];
  $("start").hidden = true;
  vA.src = f.czesci[part].src;
  vA.play().catch(() => { $("start").hidden = false; });
  dociagnij();
}

function dociagnij(){
  const f = lista[cur];
  if (part + 1 < f.czesci.length) { vB.src = f.czesci[part + 1].src; vB.preload = "auto"; vB.load(); }
}

function postep(){
  const f = lista[cur];
  let t = 0;
  for (let k = 0; k < part; k++) t += f.czesci[k].czas;
  t += vA.currentTime || 0;
  $("prog").style.width = Math.min(100, 100 * t / f.czas) + "%";
}

function koniecCzesci(){
  const f = lista[cur];
  if (part + 1 < f.czesci.length) {
    part += 1;
    [vA, vB] = [vB, vA];
    vA.classList.remove("ukryty"); vB.classList.add("ukryty");
    vA.play();
    vB.pause(); vB.removeAttribute("src"); vB.load();
    podepnij();
    dociagnij();
  } else if (wszystkie) {
    wybierz(cur + 1, true);
  } else {
    $("start").hidden = false;
  }
}

function podepnij(){
  vA.ontimeupdate = postep; vA.onended = koniecCzesci;
  vB.ontimeupdate = null; vB.onended = null;
}

function pelny(){
  const s = $("screen");
  const fs = document.fullscreenElement ? document.exitFullscreen() : (s.requestFullscreen ? s.requestFullscreen() : null);
  if (fs && fs.catch) fs.catch(() => {});
}

$("start").onclick = start;
$("bPlay").onclick = () => { if (vA.src && !vA.ended && vA.paused && $("start").hidden) vA.play(); else start(); };
$("bAll").onclick = () => { wszystkie = !wszystkie; $("bAll").setAttribute("aria-pressed", String(wszystkie)); $("bAll").textContent = wszystkie ? "Po kolei: włączone" : "Odtwarzaj wszystkie po kolei"; if (wszystkie && $("start").hidden === false) start(); };
$("bPrev").onclick = () => wybierz(cur - 1, true);
$("bNext").onclick = () => wybierz(cur + 1, true);
$("bFull").onclick = pelny;
document.addEventListener("keydown", (e) => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === " " || k === "k") { e.preventDefault(); if (!$("start").hidden) start(); else (vA.paused ? vA.play() : vA.pause()); }
  else if (k === "n" || e.key === "MediaTrackNext") wybierz(cur + 1, true);
  else if (k === "p" || e.key === "MediaTrackPrevious") wybierz(cur - 1, true);
  else if (k === "f") pelny();
});
podepnij();
tabs(); siatka(); wybierz(0, false);
</script>
