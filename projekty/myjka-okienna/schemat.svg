<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 840" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d232b"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece7df"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b9ae9c" stroke-width="2"/>
    </pattern>
    <pattern id="bristle" width="6" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <rect width="6" height="20" fill="#f2c94c"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#c99a1e" stroke-width="2"/>
    </pattern>
    <pattern id="chain" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#3b4652"/>
      <rect x="1" y="1" width="6" height="6" fill="#5b6573"/>
    </pattern>
  </defs>

  <rect width="1040" height="840" fill="#ffffff"/>

