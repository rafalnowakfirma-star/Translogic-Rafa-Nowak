  <circle cx="676" cy="342" r="3.5" fill="#1d232b"/>
  <rect x="677" y="350" width="14" height="12" rx="2" fill="#3b4652"/>
  <polyline points="676,342 676,322 668,322" fill="none" stroke="#4a5bd0" stroke-width="3"/>
