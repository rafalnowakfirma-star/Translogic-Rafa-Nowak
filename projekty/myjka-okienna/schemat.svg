  <!-- ============ TRYBY GŁOWICY ============ -->
  <text x="910" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d232b">Tryby głowicy</text>

  <!-- tryb A: w górę, szczotka -->
  <rect x="800" y="45" width="220" height="290" rx="8" fill="#f6f9f6" stroke="#1f7a4d"/>
  <text x="910" y="68" text-anchor="middle" font-weight="bold" fill="#1f7a4d">W GÓRĘ — szczotka</text>
  <rect x="820" y="80" width="7" height="230" fill="#d6ecfa" stroke="#6aa6cf"/>
