  <rect x="48" y="424" width="12" height="10" fill="#1d232b"/>
  <line x1="70" y1="342" x2="80" y2="342" stroke="#3b4652" stroke-width="4"/>

  <!-- belka górna -->
  <rect x="64" y="70" width="412" height="36" fill="#c3cad2" stroke="#4a525c" stroke-width="1.5"/>
