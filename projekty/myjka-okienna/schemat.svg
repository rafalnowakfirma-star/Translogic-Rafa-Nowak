  <polyline points="900,500 866,500 866,460 870,460" fill="none" stroke="#4a5bd0" stroke-width="5"/>
  <polyline points="866,500 866,540 840,544" fill="none" stroke="#4a5bd0" stroke-width="5"/>
  <circle cx="858" cy="460" r="19" fill="url(#bristle)" stroke="#8a6a12" opacity="0.6"/>
  <path d="M 858 430 A 30 30 0 0 1 886 448" fill="none" stroke="#5b6573" stroke-width="3"/>
  <line x1="840" y1="544" x2="828" y2="552" stroke="#1d232b" stroke-width="4"/>
  <circle cx="900" cy="500" r="6" fill="#1d232b"/>
  <rect x="906" y="510" width="26" height="18" rx="2" fill="#3b4652"/>
  <text x="919" y="523" text-anchor="middle" font-size="9" fill="#fff">serwo</text>
  <!-- natrysk czystej wody pod gumą -->
  <polygon points="844,560 852,556 852,566" fill="#1d232b"/>
  <polygon points="846,562 827,600 827,578" fill="#6aa6cf" opacity="0.6"/>
  <line x1="990" y1="420" x2="990" y2="550" stroke="#b3261e" stroke-width="4" marker-end="url(#arrR)"/>
  <text x="910" y="598" text-anchor="middle" font-size="11" fill="#1d232b">guma dociśnięta, ściąga wodę</text>
  <text x="910" y="614" text-anchor="middle" font-size="11" fill="#1d232b">czysta woda płucze przed gumą</text>
  <text x="910" y="630" text-anchor="middle" font-size="11" fill="#1d232b">szczotka stoi, odsunięta od szyby</text>

  <!-- ============ LEGENDA ============ -->
  <line x1="40" y1="684" x2="1000" y2="684" stroke="#d8dde3"/>
  <g font-size="12" fill="#1d232b">
    <text x="40" y="708"><tspan font-weight="bold">1</tspan>  belka górna z daszkiem (profil 20×40)</text>
    <text x="40" y="728"><tspan font-weight="bold">2</tspan>  motoreduktor ślimakowy jazdy z enkoderem</text>
    <text x="40" y="748"><tspan font-weight="bold">3</tspan>  wałek synchronizujący Ø8 + koła GT2 20T</text>
    <text x="40" y="768"><tspan font-weight="bold">4</tspan>  puszka IP65: ESP32, sterowniki, czujniki prądu</text>
    <text x="40" y="788"><tspan font-weight="bold">5</tspan>  szyna pionowa V-slot 20×20</text>
    <text x="40" y="808"><tspan font-weight="bold">6</tspan>  pasek GT2 PU z kordem stalowym</text>
    <text x="370" y="708"><tspan font-weight="bold">7</tspan>  wózek na rolkach POM ze sprężyną dociskową</text>
    <text x="370" y="728"><tspan font-weight="bold">8</tspan>  górny rząd dysz — roztwór z płynem</text>
    <text x="370" y="748"><tspan font-weight="bold">9</tspan>  szczotka walcowa obrotowa Ø60–70 mm</text>
    <text x="370" y="768"><tspan font-weight="bold">10</tspan>  guma ściągaczki + dolny rząd dysz (czysta woda)</text>
    <text x="370" y="788"><tspan font-weight="bold">11</tspan>  silnik szczotki 24 V</text>
    <text x="370" y="808"><tspan font-weight="bold">12</tspan>  prowadnik kablowy: przewody i 2 węże do głowicy</text>
    <text x="700" y="708"><tspan font-weight="bold">13</tspan>  skrzynka wodna: zbiornik 10 l, płyn, pompy</text>
    <text x="700" y="728"><tspan font-weight="bold">14</tspan>  osłona szczotki (przeciw rozbryzgowi)</text>
    <text x="700" y="748"><tspan font-weight="bold">15</tspan>  serwo wahacza IP67 (PARK / szczotka / guma)</text>
    <text x="700" y="768"><tspan font-weight="bold">16</tspan>  sprężyna dociskowa w wózku</text>
    <text x="700" y="808" fill="#5b6573">Rysunek poglądowy, bez skali.</text>
  </g>
