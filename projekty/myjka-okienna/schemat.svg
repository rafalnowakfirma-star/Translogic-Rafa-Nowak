    <line x1="200" y1="389" x2="200" y2="338" stroke="#b3261e"/>
    <circle cx="300" cy="400" r="11" fill="#b3261e"/><text x="300" y="404" text-anchor="middle">10</text>
    <line x1="300" y1="389" x2="300" y2="352" stroke="#b3261e"/>
    <circle cx="140" cy="440" r="11" fill="#b3261e"/><text x="140" y="444" text-anchor="middle">11</text>
    <line x1="129" y1="440" x2="124" y2="338" stroke="#b3261e"/>
    <circle cx="30" cy="470" r="11" fill="#b3261e"/><text x="30" y="474" text-anchor="middle">12</text>
    <line x1="41" y1="470" x2="54" y2="470" stroke="#b3261e"/>
    <circle cx="355" cy="625" r="11" fill="#b3261e"/><text x="355" y="629" text-anchor="middle">13</text>
    <line x1="355" y1="614" x2="355" y2="580" stroke="#b3261e"/>
