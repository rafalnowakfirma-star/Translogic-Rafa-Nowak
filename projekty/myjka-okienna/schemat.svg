  <polyline points="866,200 866,240 852,242" fill="none" stroke="#4a5bd0" stroke-width="5"/>
  <circle cx="846" cy="160" r="19" fill="url(#bristle)" stroke="#8a6a12"/>
  <path d="M 846 130 A 30 30 0 0 1 874 148" fill="none" stroke="#5b6573" stroke-width="3"/>
  <path d="M 862 176 A 22 22 0 0 1 830 176" fill="none" stroke="#8a6a12" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="852" y1="242" x2="840" y2="250" stroke="#1d232b" stroke-width="4"/>
  <circle cx="900" cy="200" r="6" fill="#1d232b"/>
  <rect x="906" y="210" width="26" height="18" rx="2" fill="#3b4652"/>
  <text x="919" y="223" text-anchor="middle" font-size="9" fill="#fff">serwo</text>
  <!-- natrysk roztworu nad szczotką -->
  <polygon points="850,126 856,120 860,128" fill="#1d232b"/>
  <polygon points="855,124 827,96 827,120" fill="#7fbf6a" opacity="0.6"/>
  <line x1="990" y1="250" x2="990" y2="120" stroke="#1f7a4d" stroke-width="4" marker-end="url(#arrG)"/>
  <text x="910" y="276" text-anchor="middle" font-size="11" fill="#1d232b">szczotka dociśnięta, 250–300 obr/min</text>
  <text x="910" y="292" text-anchor="middle" font-size="11" fill="#1d232b">natrysk roztworu z płynem nad nią</text>
  <text x="910" y="308" text-anchor="middle" font-size="11" fill="#1d232b">guma odsunięta od szyby</text>

  <!-- tryb B: w dół, guma -->
  <rect x="800" y="350" width="220" height="300" rx="8" fill="#f9f6f6" stroke="#b3261e"/>
  <text x="910" y="373" text-anchor="middle" font-weight="bold" fill="#b3261e">W DÓŁ — guma</text>
